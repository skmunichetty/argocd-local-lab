# A single-node local Kubernetes cluster running inside one Docker container.
# Create:  .\.tools\kind.exe create cluster --config kind/cluster.yaml
#
# Kubernetes 1.34 is in the tested range for Argo CD 3.5 (1.33-1.36).
# Why not 1.35+? Kubernetes 1.35 refuses to start on cgroup v1, and Docker Desktop 27.3
# (this machine) still uses cgroup v1. After upgrading Docker Desktop (newer versions use
# cgroup v2; check with: docker info --format '{{.CgroupVersion}}') you can move to 1.35+.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argocd-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
