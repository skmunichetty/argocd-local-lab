apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      containers:
        - name: api
          image: hello-api:placeholder # real tag is set in the overlay
          imagePullPolicy: IfNotPresent # use the image already loaded into the cluster
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          # Readiness: only send traffic once this succeeds.
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: restart the container if this keeps failing.
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
